run:
  name: 'lmstudio-test'
  datasetPaths:
    - './data/question_bank_v8_jsonl'
  outDir: './runs'
  resume: true
  questionLimit: null
  categories: null
  maxBudgetUsd: null
  concurrency:
    candidate: 1  # Keep low for local testing
    judge: 1

candidate:
  maxTokens: 4000

judge:
  # Using OpenRouter free model as judge
  # arcee-ai/trinity-large-preview:free tested as best quality/speed balance
  # See test_judge.js for benchmarking other free models
  router: 'openrouter'
  model: 'arcee-ai/trinity-large-preview:free'
  temperature: 0.3
  maxTokens: 8000
  structured: true
  reasoning: false  # Not all free models support reasoning

routers:
  # Ollama (required in schema but not used)
  ollama:
    baseUrl: 'http://localhost:11434/api'
    apiKeyEnv: null
    default:
      temperature: 0.7
      maxTokens: 4000
      timeoutMs: 180000

  # OpenRouter (kept for compatibility)
  openrouter:
    baseUrl: 'https://openrouter.ai/api/v1'
    apiKeyEnv: 'OPENROUTER_API_KEY'
    headers:
      HTTP-Referer: 'https://github.com/yourname/apocalypse-bench'
      X-Title: 'apocalypse-bench'
    default:
      temperature: 0.5
      maxTokens: 4000
      timeoutMs: 120000

  # LM Studio router for local model
  lmstudio:
    baseUrl: 'http://localhost:1234/v1'
    apiKeyEnv: null
    default:
      temperature: 0.7
      maxTokens: 4000
      timeoutMs: 180000

  # Anthropic for judge
  anthropic:
    apiKeyEnv: 'ANTHROPIC_API_KEY'
    default:
      temperature: 0.3
      maxTokens: 8000
      timeoutMs: 120000

models:
  # Your local LM Studio model
  - id: 'gpt-oss-20b-heretic-local'
    router: 'lmstudio'
    model: 'gpt-oss-20b-heretic'
    params:
      temperature: 0.7
      maxTokens: 4000
